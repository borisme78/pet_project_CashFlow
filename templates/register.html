<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - CashFlow</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="dark-theme">

    <div class="auth-wrapper">
        <div class="auth-card">
            <h2 style="color: #fff; text-align: center; margin-bottom: 10px;">CashFlow</h2>
            <p style="color: var(--text-muted); text-align: center; font-size: 13px; margin-bottom: 20px;">Create a new account</p>
            
            <!-- Форма реєстрації нового користувача -->
            <form method="POST">
                <div class="form-group" style="margin-bottom: 15px;">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" required placeholder="Choose username">
                </div>

                <div class="form-group" style="margin-bottom: 20px;">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required placeholder="Choose password">
                </div>

                <button type="submit" class="btn-submit" style="width: 100%;">Sign Up</button>
            </form>

            <div style="text-align: center; margin-top: 15px;">
                <a href="{{ url_for('login') }}" style="color: var(--accent-primary); font-size: 13px; text-decoration: none;">Already have an account? Login</a>
            </div>
        </div>
    </div>

</body>
</html>
