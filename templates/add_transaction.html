{% extends "base.html" %}

{% block title %}Add Transaction - CashFlow{% endblock %}

{% block content %}
<div style="max-width: 500px; margin: 0 auto; width: 100%;">
    <div class="auth-card" style="width: 100%;">
        <h3 style="color: #fff; margin-bottom: 10px;">Add New Transaction</h3>
        
        <!-- Форма для створення нової транзакції -->
        <form method="POST">
            <div class="form-group">
                <label for="amount">Amount</label>
                <input type="number" step="0.01" id="amount" name="amount" required placeholder="0.00">
            </div>

            <div class="form-group">
                <label for="type">Type</label>
                <select id="type" name="type" required>
                    <option value="expense">Expense</option>
                    <option value="income">Income</option>
                </select>
            </div>

            <div class="form-group">
                <label for="date">Date</label>
                <input type="date" id="date" name="date" required>
            </div>

            <div class="form-group">
                <label for="category">Category</label>
                <select id="category" name="category" required>
                    {% for cat in categories %}
                    <option value="{{ cat.name }}">{{ cat.name }} ({{ cat.type }})</option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label for="description">Description (optional)</label>
                <input type="text" id="description" name="description" placeholder="Note...">
            </div>

            <button type="submit" class="btn-submit" style="width: 100%; margin-top: 10px;">Save Transaction</button>
        </form>
        
        <div style="text-align: center; margin-top: 15px;">
            <a href="{{ url_for('index') }}" class="btn-action">Back to Dashboard</a>
        </div>
    </div>
</div>
{% endblock %}
